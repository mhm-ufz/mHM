[[file_profiles]]
name = "meta"
title = "Meta configuration"
description = "Project-level configuration for combined mHM runs."
default_file = "mhm.nml"
namelists = ["config_project", "config_domain", "config_processes", "config_optimize"]
required = ["config_project", "config_processes"]

[[file_profiles]]
name = "main"
title = "Main configuration"
description = "Domain-local runtime configuration for mHM."
default_file = "mhm.nml"
namelists = [
  "config_project",
  "config_domain",
  "config_processes",
  "config_optimize",
  "config_resolution",
  "config_time",
  "config_input",
  "config_coupling",
  "config_meteo",
  "config_mpr",
  "config_mhm",
  "config_mrm",
  "config_observations",
]
required = ["config_project", "config_resolution", "config_time"]

[[file_profiles]]
name = "output"
title = "Output configuration"
description = "Output namelists for mHM and mRM."
default_file = "outputs.nml"
namelists = ["output_mhm", "output_mrm"]

[[file_profiles]]
name = "parameter"
title = "Parameter configuration"
description = "Process parameter namelists for mHM."
default_file = "parameters.nml"
namelists = [
  "interception_1",
  "snow_1",
  "soil_moisture_1",
  "soil_moisture_2",
  "soil_moisture_3",
  "soil_moisture_4",
  "direct_runoff_1",
  "pet_m2",
  "pet_m1",
  "pet_1",
  "pet_2",
  "pet_3",
  "interflow_1",
  "percolation_1",
  "routing_1",
  "routing_2",
  "routing_3",
  "neutrons_1",
  "neutrons_2",
  "baseflow_1",
  "river_temperature_1",
]

[[templates]]
path = "mhm-template.nml"
profile = "main"
doc_mode = "documented"
value_mode = "filled"

[[templates]]
path = "mhm-para-template.nml"
profile = "parameter"
doc_mode = "documented"
value_mode = "filled"
simple_derived_mode = "buffer"

[[templates]]
path = "mhm-output-template.nml"
profile = "output"
doc_mode = "documented"
value_mode = "filled"
