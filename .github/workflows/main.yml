name: Continuous Integration

on:
  push:
    branches:
      - "*"
    tags:
      - "*"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  build_sdist:
    name: sdist
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: "0"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --outdir dist-sdist .

      - uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist-sdist/*.tar.gz
          if-no-files-found: error

  build_wheels:
    name: wheels / ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: linux-x86_64, os: ubuntu-24.04, arch: x86_64 }
          - { id: linux-aarch64, os: ubuntu-24.04-arm, arch: aarch64 }
          - { id: macos-arm64, os: macos-15, arch: arm64 }
          - { id: macos-x86_64, os: macos-15-intel, arch: x86_64 }
          - { id: windows-AMD64, os: windows-2025, arch: AMD64, msystem: UCRT64, compilers: "gcc:p gcc-fortran:p" }
          - { id: windows-ARM64-flang, os: windows-11-arm, arch: ARM64, msystem: CLANGARM64, compilers: "clang:p flang:p" }

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: "0"

      - name: Install R-macOS GNU Fortran 14.2
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gfortran.tar.xz"
          curl -fsSL --retry 3 -o "$archive" https://github.com/R-macos/gcc-14-branch/releases/download/gcc-14.2-darwin-r2.1/gfortran-14.2-darwin20-r2-universal.tar.xz
          echo "adf14be50fa59e8cdd3d67ee727556e6b7559949101065d8218628c46e896903  $archive" | shasum -a 256 -c -
          sudo tar -xJf "$archive" -C /
          sudo ln -sfn "$(xcrun --sdk macosx --show-sdk-path)" /opt/gfortran/SDK
          /opt/gfortran/bin/gfortran --version

      - name: Set up MSYS2 ${{ matrix.msystem }}
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          pacboy: >-
            ${{ matrix.compilers }}
            cmake:p
            ninja:p
            pkgconf:p

      - uses: pypa/cibuildwheel@v4.1.0
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          MHM_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        with:
          output-dir: dist-wheel-${{ matrix.id }}

      - uses: actions/upload-artifact@v7
        with:
          name: dist-wheel-${{ matrix.id }}
          path: dist-wheel-${{ matrix.id }}/*.whl
          if-no-files-found: error

  publish_testpypi:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - build_sdist
      - build_wheels
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/p/mhm
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish_pypi:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs:
      - build_sdist
      - build_wheels
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/mhm
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
