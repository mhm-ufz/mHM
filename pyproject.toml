[build-system]
requires = [
    "scikit_build_core>=0.11,<0.12",
    "setuptools_scm>=8",
    "numpy>=2.0,<3",
    "fypp",
]
build-backend = "scikit_build_core.build"

[project]
requires-python = ">=3.9"
name = "mhm"
description = "Python distribution of mHM with bindings."
authors = [{name = "mHM Developers", email = "mhm-admin@ufz.de"}]
readme = "pybind/README.md"
license = {text = "LGPL-3.0"}
dynamic = ["version"]
keywords = ["mHM"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Natural Language :: English",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Utilities",
]
dependencies = ["numpy>=1.17.3"]

[project.urls]
Changelog = "https://www.mhm-ufz.org"
Conda-Forge = "https://anaconda.org/conda-forge/mhm"
Documentation = "https://www.mhm-ufz.org"
Homepage = "https://www.mhm-ufz.org"
Source = "https://www.mhm-ufz.org"
Tracker = "https://www.mhm-ufz.org"

[project.optional-dependencies]
test = [
    "pytest-cov>=3",
    "xarray",
    "netCDF4",
]

[project.scripts]
mhm = "mhm.cli:mhm"
mhm-download = "mhm.download:cli"

[tool.scikit-build]
minimum-version = "build-system.requires"
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
wheel.packages = ["pybind/src/mhm"]

[tool.scikit-build.ninja]
version = ">=1.11"
make-fallback = false

[tool.scikit-build.cmake]
version = ">=3.26.1"
build-type = "Release"
args = ["-GNinja"]

[tool.scikit-build.cmake.define]
BUILD_MHM_PYBIND = "ON"

[tool.scikit-build.sdist]
include = [
    "pybind/src/mhm/_version.py",
    "forces/cmake/*.cmake",
    "forces/include",
    "forces/src/*.fypp",
    "forces/src/*.*90",
    "forces/src/*.c",
    "forces/src/CMakeLists.txt",
    "forces/*.txt",
    "forces/*.md",
    "forces/AUTHORS",
    "forces/COPYING*",
]
exclude = [
    "check",
    "CI-scripts",
    "doc",
    "hpc-module-loads",
    "*-proc",
    "test_domain**",
    ".git*",
    ".zenodo.json",
    "*.nml",
    "src/tests",
    "cmake/.gitrepo",
]
reproducible = false
# run cmake to download forces
cmake = true

[tool.setuptools_scm]
write_to = "pybind/src/mhm/_version.py"
write_to_template = "__version__ = '{version}'"
local_scheme = "no-local-version"
fallback_version = "0.0.0.dev0"
search_parent_directories = true

[tool.pytest.ini_options]
filterwarnings = [
    # numpy 2 changed PyArrayObject to an opaque struct in C headers (sizeof=16),
    # while tp_basicsize at runtime is still 96. This mismatch is an expected
    # false-positive for extensions built with numpy 2 headers and is benign.
    "ignore:numpy.ndarray size changed:RuntimeWarning",
]

[tool.black]
exclude = "_version.py"
target-version = ["py39"]

[tool.isort]
profile = "black"
multi_line_output = 3
known_first_party = ["mhm"]

[tool.coverage.run]
source = ["mhm"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover"]
show_missing = true

[tool.cibuildwheel]
# verbose output for debugging purpose
build-verbosity = 1
# Six CPython versions across the established platform/architecture jobs.
# Windows ARM64 starts at CPython 3.11, where NumPy ARM64 wheels are available.
build = ["cp39-*", "cp310-*", "cp311-*", "cp312-*", "cp313-*", "cp314-*"]
skip = ["*-musllinux_*", "cp39-win_arm64", "cp310-win_arm64"]
test-extras = "test"
test-command = "mhm -h && mhm-download -h && mhm test_domain && python -m pytest pybind/tests/"
test-sources = ["pybind/tests/", "test_domain/"]
before-all = [
    'cmake -S "{package}/CI-scripts/dependencies" -B "$MHM_DEPS_BUILD" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$MHM_DEPS_PREFIX"',
    'cmake --build "$MHM_DEPS_BUILD" --parallel',
]

[tool.cibuildwheel.environment]
MHM_BASE_PATH = "$PATH"
MHM_DEPS_BUILD = "/tmp/mhm-dependencies-build"
MHM_DEPS_PREFIX = "/tmp/mhm-dependencies"
CPM_SOURCE_CACHE = "/tmp/mhm-cpm-cache"
CC = "gcc"
FC = "gfortran"
CMAKE_PREFIX_PATH = "$MHM_DEPS_PREFIX"
HDF5_ROOT = "$MHM_DEPS_PREFIX"
NetCDF_ROOT = "$MHM_DEPS_PREFIX"
ZLIB_ROOT = "$MHM_DEPS_PREFIX"
PKG_CONFIG_PATH = "$MHM_DEPS_PREFIX/lib/pkgconfig"
PATH = "$MHM_DEPS_PREFIX/bin:$MHM_BASE_PATH"

[tool.cibuildwheel.windows]
before-all = [
    'cmake -S "{package}/CI-scripts/dependencies" -B "%MHM_DEPS_BUILD%" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="%MHM_DEPS_PREFIX%"',
    'cmake --build "%MHM_DEPS_BUILD%" --parallel',
]

[[tool.cibuildwheel.overrides]]
select = "*-manylinux_*"
inherit.environment = "append"
environment.LD_LIBRARY_PATH = "$MHM_DEPS_PREFIX/lib"

[[tool.cibuildwheel.overrides]]
select = "*-macosx_*"
inherit.environment = "append"
environment.CC = "clang"
environment.FC = "/opt/gfortran/bin/gfortran"
environment.CMAKE_GENERATOR = "Ninja"
environment.MACOSX_DEPLOYMENT_TARGET = "11.0"
environment.CMAKE_OSX_DEPLOYMENT_TARGET = "11.0"
environment.DYLD_FALLBACK_LIBRARY_PATH = "$MHM_DEPS_PREFIX/lib:/opt/gfortran/lib:/opt/gfortran/lib/gcc/current"

[[tool.cibuildwheel.overrides]]
select = "*-win_*"
inherit.environment = "append"
environment.MHM_DEPS_BUILD = "C:/mhm-dependencies-build"
environment.MHM_DEPS_PREFIX = "C:/mhm-dependencies"
environment.CPM_SOURCE_CACHE = "C:/mhm-cpm-cache"
environment.CMAKE_PREFIX_PATH = "$MHM_DEPS_PREFIX"
environment.HDF5_ROOT = "$MHM_DEPS_PREFIX"
environment.NetCDF_ROOT = "$MHM_DEPS_PREFIX"
environment.ZLIB_ROOT = "$MHM_DEPS_PREFIX"
environment.PKG_CONFIG_PATH = "$MHM_DEPS_PREFIX/lib/pkgconfig"

[[tool.cibuildwheel.overrides]]
select = "*-win_amd64"
inherit.environment = "append"
environment.MSYSTEM = "UCRT64"
environment.PATH = "$MHM_DEPS_PREFIX/bin;$MHM_MSYS2_ROOT/ucrt64/bin;$MHM_BASE_PATH"

[[tool.cibuildwheel.overrides]]
select = "*-win_arm64"
inherit.environment = "append"
environment.CC = "clang"
environment.FC = "flang"
environment.FFLAGS = "-mmlir -fdynamic-heap-array -mmlir -fstack-array-size=0"
environment.MSYSTEM = "CLANGARM64"
environment.PATH = "$MHM_DEPS_PREFIX/bin;$MHM_MSYS2_ROOT/clangarm64/bin;$MHM_BASE_PATH"
