[build-system]
requires = [
    "scikit_build_core>=0.11,<0.12",
    "setuptools_scm>=8",
    "numpy>=2.0,<3",
    "fypp",
]
build-backend = "scikit_build_core.build"

[project]
requires-python = ">=3.9"
name = "mhm"
description = "Python distribution of mHM with bindings."
authors = [{name = "mHM Developers", email = "mhm-admin@ufz.de"}]
readme = "pybind/README.md"
license = {text = "LGPL-3.0"}
dynamic = ["version"]
keywords = ["mHM"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Natural Language :: English",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Utilities",
]
dependencies = ["numpy>=1.17.3"]

[project.urls]
Changelog = "https://www.mhm-ufz.org"
Conda-Forge = "https://anaconda.org/conda-forge/mhm"
Documentation = "https://www.mhm-ufz.org"
Homepage = "https://www.mhm-ufz.org"
Source = "https://www.mhm-ufz.org"
Tracker = "https://www.mhm-ufz.org"

[project.optional-dependencies]
test = [
    "pytest-cov>=3",
    "xarray",
    "netCDF4",
]

[project.scripts]
mhm = "mhm.cli:mhm"
mhm-download = "mhm.download:cli"

[tool.scikit-build]
minimum-version = "build-system.requires"
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
wheel.packages = ["pybind/src/mhm"]

[tool.scikit-build.ninja]
version = ">=1.11"
make-fallback = false

[tool.scikit-build.cmake]
version = ">=3.26.1"
build-type = "Release"
args = ["-GNinja"]

[tool.scikit-build.cmake.define]
MHM_BUILD_PYBIND = "ON"

[tool.scikit-build.sdist]
include = [
    "pybind/src/mhm/_version.py",
    "forces/cmake/*.cmake",
    "forces/include",
    "forces/src/*.fypp",
    "forces/src/*.*90",
    "forces/src/CMakeLists.txt",
    "forces/*.txt",
    "forces/*.md",
    "forces/AUTHORS",
    "forces/COPYING*",
]
exclude = [
    "check",
    "CI-scripts",
    "doc",
    "hpc-module-loads",
    "*-proc",
    "test_domain**",
    ".git*",
    ".zenodo.json",
    "*.nml",
    "src/tests",
    "cmake/.gitrepo",
]
reproducible = false
# run cmake to download forces
cmake = true

[tool.setuptools_scm]
write_to = "pybind/src/mhm/_version.py"
write_to_template = "__version__ = '{version}'"
local_scheme = "no-local-version"
fallback_version = "0.0.0.dev0"
search_parent_directories = true

[tool.pytest.ini_options]
filterwarnings = [
    # numpy 2 changed PyArrayObject to an opaque struct in C headers (sizeof=16),
    # while tp_basicsize at runtime is still 96. This mismatch is an expected
    # false-positive for extensions built with numpy 2 headers and is benign.
    "ignore:numpy.ndarray size changed:RuntimeWarning",
]

[tool.black]
exclude = "_version.py"
target-version = ["py39"]

[tool.isort]
profile = "black"
multi_line_output = 3
known_first_party = ["mhm"]

[tool.coverage.run]
source = ["mhm"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover"]
show_missing = true

[tool.cibuildwheel]
# verbose output for debugging purpose
build-verbosity = 1
# skip py38, musl and free-threaded versions
skip = ["cp38*", "*-musllinux_*", "cp31?t-*"]
# check command
test-extras = "test"
test-command = "mhm -h && mhm-download -h && mhm test_domain && python -m pytest pybind/tests/"
test-sources = ["pybind/tests/", "test_domain/", "pyproject.toml"]

[tool.cibuildwheel.linux]
# use netcdf-c docker images (netcdf-c, hdf5, zlib pre-installed)
manylinux-x86_64-image = "ghcr.io/ocefpaf/manylinux_2_28_x86_64-netcdf"
manylinux-aarch64-image = "ghcr.io/ocefpaf/manylinux_2_28_aarch64-netcdf"
environment = { FC="gfortran", F77="gfortran", CC="gcc", CXX="g++" }

[tool.cibuildwheel.macos]
# netcdf-c from conda-forge via micromamba (set up in CI workflow)
environment = { FC="gfortran-14", F77="gfortran-14", CC="gcc-14", CXX="g++-14", CMAKE_PREFIX_PATH="/Users/runner/micromamba/envs/build", MACOSX_DEPLOYMENT_TARGET = "15.0" }
repair-wheel-command = "DYLD_FALLBACK_LIBRARY_PATH=/Users/runner/micromamba/envs/build/lib delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"

[tool.cibuildwheel.windows]
before-build = "pip install delvewheel"
environment = { FC = "ifx", CMAKE_PREFIX_PATH = 'C:\\Users\\runneradmin\\micromamba\\envs\\build\\Library', PATH = 'C:\\Users\\runneradmin\\micromamba\\envs\\build\\Library\\bin;${PATH}' }
repair-wheel-command = [
  "delvewheel show {wheel}",
  "delvewheel repair -w {dest_dir} {wheel}",
]
