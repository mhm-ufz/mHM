################
### DOC JOBS ###
################

coverage:
  when: always
  stage: code-analysis
  needs: []
  script:
    - module purge
    - module use /global/apps/modulefiles
    - module load chs-fortran-conda/0.6.0
    # run cmake with coverage support and run tests
    - cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_MHM_DRIVER=ON -DBUILD_TESTING=ON -DCMAKE_WITH_COVERAGE=ON -DCMAKE_WITH_OpenMP=OFF
    - cmake --build build --parallel 4
    - cmake --build build --target mhm_coverage_CI
    # Strip logical and physical checkout prefixes before converting for GitLab.
    - |
      mkdir -p coverage
      cp -a build/mhm_coverage_CI/. coverage/
      lcov --rc check_data_consistency=0 --add-tracefile build/mhm_coverage_CI.info \
        --substitute "s#^(\Q$PWD\E|\Q$(pwd -P)\E)/##" --output-file coverage/coverage.info
      lcov_cobertura coverage/coverage.info --base-dir . --output coverage/coverage.xml
  coverage: '/lines[\.]+\: (\d+\.\d+)\%/'
  artifacts:
    when: always
    expose_as: "Fortran coverage report"
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/coverage.xml
    paths:
      - coverage/
      - build/Testing/Temporary/LastTest.log
      - build/coverage-runs/

documentation:
  <<: *doc_template
