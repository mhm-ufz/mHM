# to use the env-var "GIT_CLONE_PATH", set the following in
# ./gitlab-runner/config.toml under [[runners]]:
#   [runners.custom_build_dir]
#     enabled = true
# This will prevent git clone conflicts for jobs ran in parallel

variables:
  GIT_DEPTH: 10
  GIT_CLONE_PATH: $CI_BUILDS_DIR/$CI_RUNNER_SHORT_TOKEN/$CI_PROJECT_PATH/$CI_COMMIT_REF_NAME/$CI_JOB_NAME

stages:
  - info
  - build
  - check-v6-nmls
  - code-analysis
  - doc
  - deploy

show-env-vars:
  stage: info
  variables:
    GIT_STRATEGY: none
    SEP: "##################################################################"
    S00: "commit date - "
    S01: "project: ${CI_PROJECT_PATH}"
    S02: "branch: ${CI_COMMIT_REF_NAME}"
    S03: "commit: ${CI_COMMIT_SHA}"
    S04: "commit msg: ${CI_COMMIT_MESSAGE}"
    S05: "clone base path: "
    S06: "runner token: ${CI_RUNNER_SHORT_TOKEN}"
  script:
    - echo -e "${SEP}\n${S00}$(date)\n${SEP}\n${S01}\n${S02}\n${S03}\n${S04}\n${SEP}\n${S05}${GIT_CLONE_PATH}\n${S06}\n${SEP}"

#################
### TEMPLATES ###
#################

# template for documentation
.doc_template: &doc_template
  when: always
  stage: doc
  needs: []
  script:
    - module purge
    - module load GCC/13.3.0 texlive/20250308
    - module use /global/apps/modulefiles
    - module load chs-fortran-conda/0.6.0
    - export PROJECT_NUMBER="$(cat version.txt)"
    - doxygen doc/doxygen.config > doxygen_log.txt 2>&1
    - |
      printf 'Building PDF with Tectonic...\n'
      if ! (
        cd latex &&
        tectonic -X compile --keep-intermediates --keep-logs refman.tex &&
        makeindex refman.idx &&
        tectonic -X compile --keep-intermediates --keep-logs refman.tex
      ) > "doxygen_latex.txt" 2>&1; then
        tail -n 80 "doxygen_latex.txt"
        exit 1
      fi
    - cp latex/refman.pdf mhm_doc.pdf
  artifacts:
    when: always
    expose_as: "Documentation HTML and PDF"
    name: "$CI_COMMIT_REF_NAME"
    paths:
      - html/
      - mhm_doc.pdf
      - doxygen_log.txt
      - doxygen_latex.txt

# Compiler and v6 validation templates
.cmake_template: &cmake_template
  when: always
  stage: build
  script:
    - source hpc-module-loads/eve.$COMPILER
    - source CI-scripts/compile
    - source CI-scripts/compile_debug
    - source CI-scripts/compile_OpenMP
    - source CI-scripts/compile_OpenMP_debug
  artifacts:
    paths:
    - mhm
    - mhm_debug
    - mhm_openmp
    - mhm_openmp_debug

.check_v6_template: &check_v6_template
  when: always
  stage: check-v6-nmls
  script:
    - source hpc-module-loads/eve.$COMPILER
    - bash CI-scripts/run_v6_namelists.sh --log-dir logs_v6 --threads 4 ./mhm_debug ./mhm ./mhm_openmp_debug ./mhm_openmp
  artifacts:
    when: always
    paths:
    - logs_v6/

.unittest_template: &unittest_template
  when: always
  stage: code-analysis
  script:
    # we need pfUnit
    - source hpc-module-loads/eve.$COMPILER
    # run cmake with testing support, build mhm and run pfunit tests
    - cmake -DCMAKE_BUILD_TYPE=Debug -DMHM_BUILD_TESTING=ON -B build
    - cmake --build build --parallel 16  # intel fails with too few (pfunit issue)
    - cmake --build build --target test

.valgrind_template: &valgrind_template
  when: always
  stage: code-analysis
  script:
    - source hpc-module-loads/eve.$COMPILER
    - cmake -S . -B debug -DCMAKE_BUILD_TYPE=Debug -DMHM_BUILD_DRIVER=ON -DMHM_BUILD_TESTING=ON -DBUILD_TESTING=ON -DMHM_WITH_OpenMP=OFF
    - cmake --build debug --target mhm test_parameter_reinitialize --parallel 4
    - module load Mamba
    - source activate /global/apps/mhm_checks/mhm_env
    - bash CI-scripts/run_valgrind.sh --log-dir build/valgrind-logs ./debug/app/mhm ./debug/src/tests/test_parameter_reinitialize
  artifacts:
    when: always
    paths:
    - build/valgrind-logs/

###################
### PY-BINDINGS ###
###################

pybindings:
  stage: build
  variables:
    GIT_DEPTH: 0  # to have all tags
    CMAKE_BUILD_PARALLEL_LEVEL: 4  # at most 4 cores
  script:
    - module load Mamba
    - mamba create -p ./mhm_env -y python=3.11 pip netcdf-fortran fortran-compiler c-compiler cxx-compiler fypp python-build black isort pytest-cov
    - source activate ./mhm_env
    # check source code
    - black --check --diff pybind
    - isort --check --diff pybind
    # create sdist and install it
    - python -m build --sdist --outdir dist .
    - pip install -v '.[test]'
    # check installation
    - python -c "import mhm; print(mhm.__version__)"
    - python -c "import mhm; print(mhm.f_version)"
    - which mhm
    - mhm -V
    - mhm -h
    - python -m mhm -h
    # Downloader tests use local mocked archives.
    - which mhm-download
    - mhm-download -V
    - mhm-download -h
    - python -m mhm.download -h
    - python -m pytest --cov mhm --cov-report term-missing --cov-report html --cov-report xml -v pybind/tests/
    # check editable installation last to not mess with pytest
    - pip install -v -e .
    - rm -rf mhm_env/
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    name: "$CI_COMMIT_REF_NAME"
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - dist
      - htmlcov

