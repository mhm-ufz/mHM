title: PET - Case -1
description: Parameters for LAI correction of externally supplied PET.
x-fortran-namelist: pet_m1
type: object
properties:
  pet_a_forest:
    $ref: parameter.yml#/$defs/parameter
    title: PET correction coefficient a for forest
    default: {min: 0.3, max: 1.3}
    properties:
      value: {examples: [0.3]}
      optimize: {examples: [true]}
  pet_a_impervious:
    $ref: parameter.yml#/$defs/parameter
    title: PET correction coefficient a for impervious areas
    default: {min: 0.3, max: 1.3}
    properties:
      value: {examples: [0.8]}
      optimize: {examples: [true]}
  pet_a_pervious:
    $ref: parameter.yml#/$defs/parameter
    title: PET correction coefficient a for pervious areas
    default: {min: 0.3, max: 1.3}
    properties:
      value: {examples: [1.3]}
      optimize: {examples: [true]}
  pet_b:
    $ref: parameter.yml#/$defs/parameter
    title: PET correction coefficient b
    default: {min: 0.0, max: 1.5}
    properties:
      value: {examples: [1.5]}
      optimize: {examples: [true]}
  pet_c:
    $ref: parameter.yml#/$defs/parameter
    title: PET correction coefficient c
    default: {min: -2.0, max: 0.0}
    properties:
      value: {examples: [-0.7]}
      optimize: {examples: [true]}
required: [pet_a_forest, pet_a_impervious, pet_a_pervious, pet_b, pet_c]
