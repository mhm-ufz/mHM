title: PET - Case 1
description: Parameters for the Hargreaves-Samani PET method.
x-fortran-namelist: pet_1
type: object
properties:
  correction_factor_min:
    $ref: parameter.yml#/$defs/parameter
    title: Minimum PET aspect-correction factor
    default: {lower_bound: 0.7, upper_bound: 1.3}
    properties:
      value: {examples: [0.93]}
      optimize: {examples: [true]}
  correction_factor_max:
    $ref: parameter.yml#/$defs/parameter
    title: Maximum PET aspect-correction factor
    default: {lower_bound: 0.0, upper_bound: 0.2}
    properties:
      value: {examples: [0.19]}
      optimize: {examples: [true]}
  aspect_threshold:
    $ref: parameter.yml#/$defs/parameter
    title: Aspect threshold
    default: {lower_bound: 160.0, upper_bound: 200.0}
    properties:
      value: {examples: [171.0]}
      optimize: {examples: [true]}
  hargreaves_samani_coefficient:
    $ref: parameter.yml#/$defs/parameter
    title: Hargreaves-Samani coefficient
    default: {lower_bound: 0.0016, upper_bound: 0.003}
    properties:
      value: {examples: [0.0023]}
      optimize: {examples: [true]}
required:
  - correction_factor_min
  - correction_factor_max
  - aspect_threshold
  - hargreaves_samani_coefficient
