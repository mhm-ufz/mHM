title: Baseflow - Case 1
description: Geological baseflow recession parameters.
x-fortran-namelist: baseflow_1
type: object
properties:
  baseflow_recession:
    title: Baseflow recession for each geological unit
    description: Values are addressed by the first column of each geology class-definition file.
    type: array
    x-fortran-shape: n_geo_units
    items:
      $ref: parameter.yml#/$defs/parameter
      default: {min: 1.0, max: 1000.0}
      properties:
        value: {examples: [100.0]}
        optimize: {examples: [true]}
required: [baseflow_recession]
