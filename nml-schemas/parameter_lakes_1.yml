title: Lakes - Case 1
description: Parameters for the mHM lake module (mLM) spill, storage, and regulation.
x-fortran-namelist: lakes_1
type: object
properties:
  spill_coefficient_of_discharge:
    $ref: parameter.yml#/$defs/parameter
    title: Spill coefficient of discharge
    default: {min: 2.64, max: 3.95}
    properties:
      value: {examples: [3.0]}
      optimize: {examples: [true]}
  spill_exponent:
    $ref: parameter.yml#/$defs/parameter
    title: Spill exponent
    default: {min: 0.5, max: 2.5}
    properties:
      value: {examples: [1.5]}
      optimize: {examples: [true]}
  longterm_baseflow:
    $ref: parameter.yml#/$defs/parameter
    title: Long-term baseflow
    default: {min: 0.0001, max: 5.0}
    properties:
      value: {examples: [4.5]}
      optimize: {examples: [true]}
  exponent_for_percolation:
    $ref: parameter.yml#/$defs/parameter
    title: Exponent for percolation
    default: {min: 8.0, max: 15.0}
    properties:
      value: {examples: [11.0]}
      optimize: {examples: [true]}
  regulation_hanasaki_alpha:
    $ref: parameter.yml#/$defs/parameter
    title: Hanasaki regulation alpha
    default: {min: 0.6, max: 0.95}
    properties:
      value: {examples: [0.85]}
      optimize: {examples: [true]}
  regulation_rho_beta:
    $ref: parameter.yml#/$defs/parameter
    title: Regulation rho (beta)
    default: {min: 0.5, max: 5.0}
    properties:
      value: {examples: [2.0]}
      optimize: {examples: [true]}
  regulation_cstar:
    $ref: parameter.yml#/$defs/parameter
    title: Regulation c-star
    default: {min: 0.001, max: 20.0}
    properties:
      value: {examples: [0.5]}
      optimize: {examples: [true]}
  regulation_hedging_omega:
    $ref: parameter.yml#/$defs/parameter
    title: Regulation hedging omega
    default: {min: 0.0, max: 1.0}
    properties:
      value: {examples: [0.5]}
      optimize: {examples: [true]}
  regulation_kappa_lambda:
    $ref: parameter.yml#/$defs/parameter
    title: Regulation kappa (lambda)
    default: {min: 0.1, max: 1.0}
    properties:
      value: {examples: [0.5]}
      optimize: {examples: [true]}
required:
  - spill_coefficient_of_discharge
  - spill_exponent
  - longterm_baseflow
  - exponent_for_percolation
  - regulation_hanasaki_alpha
  - regulation_rho_beta
  - regulation_cstar
  - regulation_hedging_omega
  - regulation_kappa_lambda
